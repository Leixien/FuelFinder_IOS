name: Fuel
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fuel:
    type: application
    platform: iOS
    sources:
      - Fuel
      # Shared with FuelTests: drives SwiftUI previews and the -uiTesting launch mode.
      - path: FuelTests/Fixtures/stations_sample.json
        buildPhase: resources
    info:
      path: Fuel/Info.plist
      properties:
        CFBundleDisplayName: Fuel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        DataURL: $(DATA_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocationWhenInUseUsageDescription: La posizione serve a trovare i distributori più vicini e non lascia mai il telefono.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Color(.best) etc. come from Assets.xcassets; explicit so Xcode and xcodebuild agree.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  FuelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FuelTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
    dependencies:
      - target: Fuel
  FuelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FuelUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).uitests
    dependencies:
      - target: Fuel
schemes:
  Fuel:
    build:
      targets:
        Fuel: all
    test:
      targets: [FuelTests, FuelUITests]
